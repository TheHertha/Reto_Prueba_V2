<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. NutriBot - Chat flotante</title>
  
  <!-- Marked.js para renderizar Markdown (negritas, listas, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@17.0.2/lib/marked.umd.min.js"></script>
  
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background: #f4f6f9; }
    
    /* Botón flotante */
    .chatbot-toggle {
      position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
      background: linear-gradient(135deg, #ed563b, #ed563b); color: white;
      border: none; border-radius: 50%; cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 184, 148, 0.4); z-index: 1000;
      display: flex; align-items: center; justify-content: center; transition: all 0.3s;
    }
    .chatbot-toggle:hover { transform: scale(1.1); }

    /* Contenedor del chat */
    .chatbot-container {
      position: fixed; bottom: 110px; right: 30px; width: 380px; height: 520px;
      background: white; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      overflow: hidden; display: none; flex-direction: column; z-index: 999;
    }
    .chatbot-container.open { display: flex; }

    .chatbot-header {
      background: linear-gradient(135deg, #ed563b, #ed563b); color: white;
      padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
    }
    .chatbot-header h3 { margin: 0; font-size: 18px; }

    .chatbot-close { background: none; border: none; color: white; font-size: 28px; cursor: pointer; }

    .chatbot-messages {
      flex: 1; padding: 20px; overflow-y: auto; background: #f8f9fa;
      display: flex; flex-direction: column; gap: 12px;
    }

    .chatbot-message {
      max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4;
    }
    .chatbot-message.bot { align-self: flex-start; background: #e9ecef; border-bottom-left-radius: 4px; }
    .chatbot-message.user { align-self: flex-end; background: #ed563b; color: white; border-bottom-right-radius: 4px; }

    .chatbot-input {
      padding: 15px; background: white; border-top: 1px solid #eee; display: flex;
    }
    .chatbot-input input {
      flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 30px; font-size: 15px;
    }
    .chatbot-input button {
      margin-left: 10px; background: #ed563b; color: white; border: none;
      border-radius: 50%; width: 44px; height: 44px; cursor: pointer;
    }

    /* Footer disclaimer (siempre visible) */
    .chatbot-footer {
      padding: 8px 15px; background: #f8f9fa; border-top: 1px solid #eee;
      font-size: 12px; color: #666; text-align: center;
    }
    .chatbot-footer small { display: block; line-height: 1.3; }
  </style>
</head>
<body>

  <!-- Botón flotante -->
  <button class="chatbot-toggle" id="chatbotToggle">
    <svg width="28" height="28" fill="white" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
  </button>

  <!-- Contenedor del chat -->
  <div class="chatbot-container" id="chatbotContainer">
    <div class="chatbot-header">
      <h3>🩺 Dr. NutriBot</h3>
      <button class="chatbot-close" id="chatbotClose">×</button>
    </div>

    <div class="chatbot-messages" id="chatbotMessages">
      <div class="chatbot-message bot">
        ¡Hola! Soy el Dr. NutriBot.<br>
        ¿Qué duda tienes sobre nutrición hoy?
      </div>
    </div>

    <div class="chatbot-input">
      <input type="text" id="chatbotInput" placeholder="Escribe tu duda...">
      <button id="chatbotSend">→</button>
    </div>

    <!-- Disclaimer fijo (estilo ChatGPT) -->
    <div class="chatbot-footer">
      <small>⚠️ Dr. NutriBot es un asistente de IA. No sustituye a un profesional de la salud.<br>
      Consulta siempre a un nutricionista certificado para consejos personalizados.</small>
    </div>
  </div>

  <script>
    const API_KEY = "AIzaSyCttKjtKBeuMP3Z1ReOH0mYt2fWVLeGc_Q"; // ← Tu clave aquí

    const toggle = document.getElementById('chatbotToggle');
    const container = document.getElementById('chatbotContainer');
    const closeBtn = document.getElementById('chatbotClose');
    const messagesDiv = document.getElementById('chatbotMessages');
    const input = document.getElementById('chatbotInput');
    const sendBtn = document.getElementById('chatbotSend');

    let history = [];

    toggle.addEventListener('click', () => container.classList.toggle('open'));
    closeBtn.addEventListener('click', () => container.classList.remove('open'));

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      history.push({ role: "user", parts: [{ text }] });
      input.value = '';

      const typing = document.createElement('div');
      typing.className = 'chatbot-message bot typing';
      typing.textContent = 'Dr. NutriBot está pensando...';
      messagesDiv.appendChild(typing);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: history,
              system_instruction: {
                parts: [{
                  text: `Eres Dr. NutriBot, un asistente de nutrición amigable y profesional.
                  Siempre responde en español, claro, corto y positivo.
                  Usa Markdown (negritas, listas, viñetas) cuando sea útil para que se vea mejor.
                  Solo responde dudas superficiales sobre alimentos, productos o hábitos generales.
                  Nunca des planes de dieta personalizados, diagnósticos ni recomendaciones médicas.`
                }]
              }
            })
          }
        );

        if (!response.ok) throw new Error("Error del servidor");

        const data = await response.json();
        let botText = data.candidates[0].content.parts[0].text;

        typing.remove();
        addMessage(botText, 'bot');           // ← Aquí se renderiza con Markdown
        history.push({ role: "model", parts: [{ text: botText }] });

      } catch (err) {
        typing.remove();
        addMessage("¡Ups! Algo falló. Intenta de nuevo.", 'bot');
      }
    }

    function addMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = `chatbot-message ${sender}`;
      
      if (sender === 'bot') {
        // Renderiza Markdown para el bot
        msg.innerHTML = marked.parse(text);
      } else {
        // Usuario queda como texto plano
        msg.textContent = text;
      }
      
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
  </script>
</body>
</html>
